[project]
name = "kitsu-cli"
version = "0.1.0"
description = "CLI for the Kitsu production tracker, powered by Gazu"
readme = "README.md"
authors = [
    { name = "Frank Rousseau", email = "frank@cg-wire.com" }
]
requires-python = ">=3.10"
dependencies = [
    "gazu>=1.3.1",
    "click>=8.1",
    "rich>=13.0",
    "tomli-w>=1.0",
]

[project.scripts]
kitsu = "kitsu_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kitsu_cli"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

# shortcut: gazu main is not on PyPI yet, drop this source once gazu > 1.3.1 is released.
[tool.uv.sources]
gazu = { git = "https://github.com/cgwire/gazu", rev = "f33b3af" }
